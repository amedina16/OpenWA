services:
  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    expose:
      - '2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - WEBHOOK_TIMEOUT=10000
      - WEBHOOK_MAX_RETRIES=3
      - API_MASTER_KEY=cambia_esto_por_una_clave_segura
    volumes:
      - openwa-data:/app/data
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.openwa-api.rule=Host(`whats.th3roots.net`)'
      - 'traefik.http.routers.openwa-api.entrypoints=websecure'
      - 'traefik.http.routers.openwa-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.openwa-api.loadbalancer.server.port=2785'

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: openwa-dashboard
    expose:
      - '80'
    depends_on:
      - openwa-api
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.openwa-dashboard.rule=Host(`dash.th3roots.net`)'
      - 'traefik.http.routers.openwa-dashboard.entrypoints=websecure'
      - 'traefik.http.routers.openwa-dashboard.tls.certresolver=letsencrypt'
      - 'traefik.http.services.openwa-dashboard.loadbalancer.server.port=80'

volumes:
  openwa-data:

networks:
  dokploy-network:
    external: true
